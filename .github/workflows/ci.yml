name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Manifests, shell, TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate JSON manifests
        run: |
          for file in .claude-plugin/plugin.json hooks/hooks.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file"
            echo "ok  $file"
          done

      - name: Every declared module exists
        run: |
          python3 - <<'PY'
          import json, os, sys
          modules = json.load(open("hooks/hooks.json")).get("modules", [])
          missing = [m for m in modules if not os.path.exists(os.path.join("hooks", m))]
          for m in missing:
              print(f"::error::hooks/{m} is declared in hooks.json but absent")
          sys.exit(1 if missing else 0)
          PY

      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh
          for file in scripts/*.sh; do
            test -x "$file" || { echo "::error::$file is not executable"; exit 1; }
          done

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Node 22.18+ runs the TypeScript sources directly, so the unit tests need
      # no build step and no dependencies. They cover the pure modules: the
      # keep-set rule, the activation rule, and settings parsing.
      - name: Unit tests
        run: node --test "test/**/*.test.ts"

      - name: Parse every hooks module
        run: |
          npx --yes -p typescript node -e "
            const ts = require('typescript');
            const fs = require('fs');
            let failed = false;
            for (const file of fs.readdirSync('hooks').filter(f => f.endsWith('.ts'))) {
              const path = 'hooks/' + file;
              const source = ts.createSourceFile(path, fs.readFileSync(path, 'utf8'), ts.ScriptTarget.ES2022, true);
              const diagnostics = source.parseDiagnostics ?? [];
              if (diagnostics.length) {
                failed = true;
                for (const d of diagnostics) {
                  console.log('::error file=' + path + '::' + ts.flattenDiagnosticMessageText(d.messageText, ' '));
                }
              } else {
                console.log('ok  ' + path);
              }
            }
            process.exit(failed ? 1 : 0);
          "

  benchmark:
    name: Benchmark harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # The harness has no third-party dependencies: it is standard library
      # only, for the same reason the plugin is. Driving a real session needs a
      # terminal and an API key, so CI checks everything except that -- the
      # pure modules, the workload specifications, and that the code imports.
      - name: Harness tests
        run: make eval-test

      - name: Workloads are well formed
        run: |
          PYTHONPATH=eval python3 - <<'PY'
          import sys
          from pathlib import Path
          from taskcut_eval import arms, workload
          KINDS = (workload.KIND_HEADLINE, workload.KIND_INCIDENTAL, workload.KIND_SUPERSEDED)
          loaded = workload.load_all(Path("eval/workloads"))
          if not loaded:
              print("::error::no workloads found"); sys.exit(1)
          failed = False
          for name, w in loaded.items():
              if not w.files:
                  print(f"::error::{name} names no files"); failed = True
              if not w.probes and not w.checks:
                  print(f"::error::{name} has neither probes nor checks, so nothing grades it"); failed = True
              for probe in w.probes:
                  if probe.kind not in KINDS:
                      print(f"::error::{name}/{probe.id} has unknown kind {probe.kind!r}"); failed = True
                  if not probe.expect:
                      print(f"::error::{name}/{probe.id} expects nothing, so it can never fail"); failed = True
                  if set(probe.expect) & set(probe.reject):
                      print(f"::error::{name}/{probe.id} expects and rejects the same string"); failed = True
              ids = [p.id for p in w.probes] + [c.id for c in w.checks]
              if len(set(ids)) != len(ids):
                  print(f"::error::{name} has duplicate probe or check ids"); failed = True
              if w.checks and not w.briefing:
                  print(f"::error::{name} has checks but no briefing to state the contract"); failed = True
              print(f"ok  {name}: {len(w.files)} steps, {len(w.probes)} probes, {len(w.checks)} checks")
          for name, arm in arms.ARMS.items():
              print(f"ok  arm {name}")
          sys.exit(1 if failed else 0)
          PY

      # Every setting an arm overrides has to exist, or a run silently measures
      # the default instead of the variable it was meant to change.
      - name: Arms only override settings the plugin has
        run: |
          PYTHONPATH=eval python3 - <<'PY'
          import json, sys
          from taskcut_eval import arms
          manifest = json.load(open(".claude-plugin/plugin.json"))["userConfig"]
          failed = False
          for name, arm in arms.ARMS.items():
              for key in arm.config:
                  if key not in manifest:
                      print(f"::error::arm {name} sets {key!r}, which the plugin does not have")
                      failed = True
          sys.exit(1 if failed else 0)
          PY

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Required files are present
        run: |
          missing=0
          for file in README.md LICENSE NOTICE CHANGELOG.md CONTRIBUTING.md \
                      CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md \
                      .github/CODEOWNERS .claude-plugin/marketplace.json \
                      docs/design.md docs/troubleshooting.md docs/compatibility.md \
                      docs/measurement.md eval/README.md Makefile; do
            if [ ! -f "$file" ]; then echo "::error::$file is missing"; missing=1; fi
          done
          exit "$missing"
      - name: Generated declarations are not committed
        run: |
          if git ls-files --error-unmatch .claude/types/claude-code.d.ts >/dev/null 2>&1; then
            echo "::error::.claude/types is generated per Claude Code version and must not be committed"
            exit 1
          fi
          echo "ok"
